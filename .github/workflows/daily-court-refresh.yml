name: Daily Court Resources Refresh

# Why an external cron instead of an in-process scheduler:
#   • Render free/standard web services sleep when idle — an APScheduler thread
#     would simply not be running at 2am. A GitHub Actions ping both WAKES the
#     service and triggers the capture.
#   • The capture must run ON the backend (that's where the SQLite Persistent
#     Disk lives), so this job just calls the token-gated endpoint; the heavy
#     work runs in a background thread on Render and this job polls the result.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   LEXAMPLIFY_API_BASE   e.g. https://api.lexamplify.com   (no trailing slash)
#   ADMIN_SYNC_TOKEN      same value set on the backend's ADMIN_SYNC_TOKEN env

on:
  schedule:
    - cron: '0 1 * * *'        # 01:00 UTC ≈ 06:30 IST, once a day
  workflow_dispatch:
    inputs:
      source:
        description: 'local (fast, re-seeds judges) or live (also scrapes rosters)'
        default: 'local'
        type: choice
        options: [local, live]

concurrency:
  group: court-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily capture
        env:
          API_BASE: ${{ secrets.LEXAMPLIFY_API_BASE }}
          TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
          SOURCE: ${{ github.event.inputs.source || 'local' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Missing LEXAMPLIFY_API_BASE or ADMIN_SYNC_TOKEN secret."; exit 1
          fi
          echo "Triggering daily-refresh (source=$SOURCE)…"
          code=$(curl -s -o resp.json -w '%{http_code}' --max-time 90 \
            "$API_BASE/api/admin/daily-refresh?token=$TOKEN&source=$SOURCE" || true)
          echo "HTTP $code"; cat resp.json 2>/dev/null || true; echo
          if [ "$code" != "202" ]; then echo "Trigger failed."; exit 1; fi

      - name: Wait for the background capture, then read status
        env:
          API_BASE: ${{ secrets.LEXAMPLIFY_API_BASE }}
          TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting ~3 min for the background capture to finish…"
          sleep 180
          curl -s --max-time 90 "$API_BASE/api/admin/refresh-status?token=$TOKEN" \
            -o status.json || true
          cat status.json; echo
          python - <<'PY'
          import json, sys
          try:
              d = json.load(open('status.json'))
          except Exception as e:
              print('Could not read status:', e); sys.exit(1)
          newest = {}
          for r in d.get('runs', []):            # runs are newest-first
              newest.setdefault(r['task'], r)
          summary = {t: r['status'] for t, r in newest.items()}
          print('Latest per task:', summary)
          errored = [t for t, r in newest.items() if r['status'] == 'error']
          if errored:
              print('Errored tasks:', errored); sys.exit(1)
          print('All capture tasks ok/warn.')
          PY
