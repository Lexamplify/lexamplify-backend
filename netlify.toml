# Netlify test environment for the REAL LexAmplify product.
# Site: lexamplify-app.netlify.app (team "stev" / account goutham037).
# Production hosting is Firebase (app.lexamplify.com) and ignores this file —
# these settings only affect Netlify builds.
#
# To make this auto-deploy: connect THIS repo (Lexamplify/lexamplify-backend) to
# the lexamplify-app Netlify site in the dashboard. Until then, deploy manually:
#   cd frontend && npm run build -- --mode netlify && cd ..
#   netlify deploy --site 53839d7e-20fd-4b57-b588-8e5972052568 --dir frontend/dist --no-build --prod

[build]
  base = "frontend"
  command = "npm run build -- --mode netlify"
  publish = "dist"

# API proxy + SPA fallback also live in frontend/public/_redirects (ship in dist);
# declared here too so a repo-connected build has them even before dist is read.
[[redirects]]
  from = "/api/*"
  to = "https://api.lexamplify.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
